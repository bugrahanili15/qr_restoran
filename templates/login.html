<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici / Personel Girişi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-amber-500">🔒 Personel Girişi</h1>
            <p class="text-xs text-gray-400 mt-1">Mutfak ve Garson paneline erişmek için giriş yapın</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500 text-red-300 p-3 rounded-lg text-sm mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1 font-semibold">Kullanıcı Adı</label>
                <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-500 transition">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1 font-semibold">Şifre</label>
                <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-500 transition">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg active:scale-95">
                Giriş Yap
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500">
            Varsayılan Giriş: <span class="text-gray-300 font-mono">admin / admin123</span>
        </div>
    </div>
</body>
</html>
