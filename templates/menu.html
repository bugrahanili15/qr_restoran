<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masa {{ table_no }} - Restoran & Cafe Menüsü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-36">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <span class="text-xs text-slate-500 font-medium uppercase tracking-wider">Masa Siparişi</span>
                <h1 class="text-xl font-extrabold text-slate-900">Masa {{ table_no }}</h1>
            </div>
            <button onclick="requestWaiter()" class="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-medium px-3.5 py-2 rounded-xl text-xs transition active:scale-95 shadow-sm">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                Garson Çağır
            </button>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4 space-y-5">

        <!-- Masanın Canlı Birikmiş Adisyon Kutusu -->
        <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-4 rounded-2xl shadow-md border border-slate-700/50 flex justify-between items-center">
            <div>
                <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Masaya Ait Aktif Adisyon</p>
                <p id="table-total-bill" class="text-2xl font-extrabold text-amber-400">0 TL</p>
            </div>
            <button onclick="loadTableBill()" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 transition text-slate-300">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>

        <!-- Yatay Kategori Bandı -->
        <div class="sticky top-[61px] bg-slate-50 pt-2 pb-2 z-30">
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <button onclick="filterCategory('all', this)" class="category-btn border bg-slate-900 text-white font-semibold text-xs px-4 py-2.5 rounded-xl whitespace-nowrap shadow-sm transition">
                    Tümü
                </button>
                <button onclick="filterCategory('Ana Yemekler', this)" class="category-btn border bg-white border-slate-200 text-slate-700 font-medium text-xs px-4 py-2.5 rounded-xl whitespace-nowrap shadow-sm hover:border-slate-300 transition">
                    Ana Yemekler
                </button>
                <button onclick="filterCategory('Salatalar', this)" class="category-btn border bg-white border-slate-200 text-slate-700 font-medium text-xs px-4 py-2.5 rounded-xl whitespace-nowrap shadow-sm hover:border-slate-300 transition">
                    Salatalar
                </button>
                <button onclick="filterCategory('Tatlılar', this)" class="category-btn border bg-white border-slate-200 text-slate-700 font-medium text-xs px-4 py-2.5 rounded-xl whitespace-nowrap shadow-sm hover:border-slate-300 transition">
                    Tatlılar
                </button>
                <button onclick="filterCategory('Sıcak İçecekler', this)" class="category-btn border bg-white border-slate-200 text-slate-700 font-medium text-xs px-4 py-2.5 rounded-xl whitespace-nowrap shadow-sm hover:border-slate-300 transition">
                    Sıcak İçecekler
                </button>
                <button onclick="filterCategory('Soğuk İçecekler', this)" class="category-btn border bg-white border-slate-200 text-slate-700 font-medium text-xs px-4 py-2.5 rounded-xl whitespace-nowrap shadow-sm hover:border-slate-300 transition">
                    Soğuk İçecekler
                </button>
            </div>
        </div>

        <!-- Görselli Ürün Kartları Listesi -->
        <div id="product-list" class="space-y-4">
            {% for product in products %}
            <div class="product-item bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex gap-3.5 items-center transition hover:border-slate-300" data-category="{{ product.category }}">
                <!-- Ürün Görseli -->
                <img src="{{ product.image_url }}" alt="{{ product.name }}" class="w-24 h-24 object-cover rounded-xl border border-slate-100 flex-shrink-0">
                
                <div class="flex-1 flex flex-col justify-between h-24">
                    <div>
                        <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">{{ product.category }}</span>
                        <h3 class="font-bold text-slate-900 text-sm leading-snug">{{ product.name }}</h3>
                        <p class="text-xs text-slate-500 line-clamp-2 mt-0.5">{{ product.description }}</p>
                    </div>
                    <div class="flex justify-between items-center mt-1">
                        <span class="text-emerald-700 font-extrabold text-sm">{{ product.price }} TL</span>
                        <button data-name="{{ product.name }}" 
                                data-price="{{ product.price }}"
                                onclick="addToCart(this)" 
                                class="bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs px-3.5 py-1.5 rounded-xl shadow-sm active:scale-95 transition">
                            + Ekle
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

    </div>

    <!-- Alt Sepet Paneli -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 shadow-2xl max-w-md mx-auto z-40">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-xs text-slate-500 font-medium">Sepet Toplamı</p>
                <p id="cart-total-price" class="font-extrabold text-xl text-slate-900">0 TL</p>
            </div>
            <button onclick="sendOrder()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-6 py-3 rounded-xl shadow-md active:scale-95 transition flex items-center gap-2">
                <span>Siparişi Gönder</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>
    </div>

    <script>
        let cart = [];
        const tableNo = parseInt("{{ table_no }}", 10);

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws/live`);
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.table_no === tableNo) {
                loadTableBill();
            }
        };

        window.onload = function() {
            loadTableBill();
        };

        async function loadTableBill() {
            try {
                const response = await fetch(`/api/table/${tableNo}/bill`);
                const data = await response.json();
                document.getElementById('table-total-bill').innerText = `${data.total_remaining_bill || 0} TL`;
            } catch (e) {
                console.error("Hesap sorgulama hatası:", e);
            }
        }

        function filterCategory(category, btn) {
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('bg-slate-900', 'text-white', 'font-semibold');
                b.classList.add('bg-white', 'text-slate-700', 'border-slate-200');
            });
            btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-200');
            btn.classList.add('bg-slate-900', 'text-white', 'font-semibold');

            const items = document.querySelectorAll('.product-item');
            items.forEach(item => {
                if (category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function addToCart(button) {
            const name = button.getAttribute('data-name');
            const price = parseFloat(button.getAttribute('data-price'));

            let item = cart.find(i => i.name === name);
            if (item) {
                item.quantity += 1;
            } else {
                cart.push({ name: name, price: price, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            let total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-total-price').innerText = total + " TL";
        }

        async function sendOrder() {
            if (cart.length === 0) return alert("Sepetiniz boş!");

            const response = await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ table_no: tableNo, cart: cart })
            });

            if (response.ok) {
                alert("Siparişiniz başarıyla mutfağa iletildi.");
                cart = [];
                updateCartUI();
                loadTableBill();
            }
        }

        async function requestWaiter() {
            if (confirm("Masanıza garson çağrılsın mı?")) {
                const response = await fetch('/api/call-waiter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table_no: tableNo })
                });
                if (response.ok) {
                    alert("Garsona bildirim gönderildi.");
                }
            }
        }
    </script>
</body>
</html>
